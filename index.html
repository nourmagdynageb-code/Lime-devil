<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Tajawal', sans-serif;
  background-color: #0d1117;
  color: #e6edf3;
  direction: rtl;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.facade-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background-color: #202124;
  color: #bdc1c6;
  position: fixed;
  inset: 0;
  z-index: 99999;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.facade-container.hide {
  opacity: 0;
  transform: scale(0.98);
  pointer-events: none;
}

.logo {
  font-size: 5rem;
  font-weight: 700;
  letter-spacing: -2px;
  margin-bottom: 30px;
  user-select: none;
}

.logo span:nth-child(1) { color: #4285f4; }
.logo span:nth-child(2) { color: #ea4335; }
.logo span:nth-child(3) { color: #fbbc05; }
.logo span:nth-child(4) { color: #4285f4; }
.logo span:nth-child(5) { color: #34a853; }
.logo span:nth-child(6) { color: #ea4335; }

.search-form {
  width: 100%;
  max-width: 584px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.search-box {
  width: 100%;
  position: relative;
}

.search-input {
  width: 100%;
  height: 46px;
  background-color: #202124;
  border: 1px solid #5f6368;
  border-radius: 24px;
  padding: 0 45px 0 20px;
  color: #e8eaed;
  font-size: 16px;
  outline: none;
  transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
  font-family: 'Tajawal', sans-serif;
}

.search-input:hover,
.search-input:focus {
  background-color: #303134;
  border-color: rgba(255,255,255,0);
  box-shadow: 0 1px 6px rgba(32,33,36,0.28);
}

.search-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #9aa0a6;
  font-size: 16px;
}

.btn-group {
  margin-top: 28px;
  display: flex;
  gap: 12px;
}

.google-btn {
  background-color: #303134;
  border: 1px solid #303134;
  color: #e8eaed;
  padding: 10px 16px;
  font-size: 14px;
  border-radius: 4px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  font-family: 'Tajawal', sans-serif;
}

.google-btn:hover {
  border-color: #5f6368;
  color: #f8f9fa;
}

.message {
  margin-top: 18px;
  color: #ea4335;
  font-size: 14px;
  min-height: 20px;
  opacity: 0;
  transition: opacity 0.3s;
}

.message.show {
  opacity: 1;
}

#app {
  display: none;
  flex: 1;
  flex-direction: column;
}

.lock-screen,
.stealth-screen {
  position: fixed;
  inset: 0;
  background-color: #0d1117;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
  flex-direction: column;
}

.stealth-screen {
  background-color: #000;
  z-index: 20000;
}

.lock-card {
  background: #161b22;
  padding: 30px;
  border-radius: 12px;
  border: 1px solid #30363d;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.lock-card h2 {
  margin-bottom: 20px;
  color: #58a6ff;
}

.lock-input {
  width: 100%;
  padding: 12px;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #fff;
  margin-bottom: 15px;
  font-size: 16px;
  text-align: center;
}

.lock-btn {
  width: 100%;
  padding: 12px;
  background: #238636;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
}

.lock-btn:hover {
  background: #2ea043;
}

.chat-container {
  max-width: 800px;
  margin: 20px auto;
  width: 100%;
  padding: 20px;
  background: #161b22;
  border-radius: 8px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 20px;
  max-height: 60vh;
}

.chat-input-area {
  display: flex;
  gap: 10px;
}

.chat-input {
  flex: 1;
  padding: 12px;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #fff;
}

.chat-send-btn {
  padding: 12px 24px;
  background: #1f6feb;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.custom-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 30000;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #161b22;
  padding: 20px;
  border-radius: 8px;
  max-width: 400px;
  width: 90%;
  text-align: center;
}
</style>
</head>
<body>

<div class="facade-container" id="searchFacade">
  <div class="logo">
    <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <form class="search-form" id="searchFormNew">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" class="search-input" id="searchInputNew" autocomplete="off" placeholder="">
    </div>
    <div class="btn-group">
      <button type="submit" class="google-btn">بحث Google‏</button>
      <button type="button" class="google-btn" id="luckyBtn">ضربة حظ</button>
    </div>
    <div class="message" id="searchMessage"></div>
  </form>
</div>

<div id="lockScreen" class="lock-screen" style="display: none;">
  <div class="lock-card">
    <h2>تأكيد الهوية</h2>
    <input type="password" id="passInput" class="lock-input" placeholder="أدخل كلمة السر">
    <button id="unlockBtn" class="lock-btn">دخول</button>
  </div>
</div>

<div id="stealthScreen" class="stealth-screen" style="display: none;"></div>

<div id="app">
  <div class="chat-container">
    <h2>المحادثة الرسمية</h2>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك...">
      <button id="sendBtn" class="chat-send-btn">إرسال</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://YOUR_DATABASE_URL.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const lockScreen = document.getElementById("lockScreen");
const stealthScreen = document.getElementById("stealthScreen");
const mainApp = document.getElementById("app");
const searchFacade = document.getElementById("searchFacade");

function returnToFacade(){
  document.querySelectorAll(".custom-modal").forEach(m => m.style.display = "none");
  mainApp.style.display = "none";
  lockScreen.style.display = "none";
  stealthScreen.style.display = "none";

  if (searchFacade) {
    searchFacade.style.display = "flex";
    searchFacade.classList.remove("hide");
    const searchInput = document.getElementById("searchInputNew");
    if (searchInput) {
      searchInput.value = "";
      setTimeout(() => searchInput.focus(), 100);
    }
  }
}

onValue(ref(db, 'system/globalLock'), (snapshot) => {
  const isLocked = snapshot.val();
  if (isLocked) {
    returnToFacade();
  }
});

onValue(ref(db, 'system/globalStealth'), (snapshot) => {
  const isStealth = snapshot.val();
  if (isStealth) {
    stealthScreen.style.display = "flex";
  } else {
    stealthScreen.style.display = "none";
  }
});

document.getElementById("unlockBtn").addEventListener("click", () => {
  const pass = document.getElementById("passInput").value;
  if (pass === "1234") { 
    lockScreen.style.display = "none";
    mainApp.style.display = "flex";
  } else {
    alert("كلمة السر خاطئة!");
  }
});
</script>

<script>
const SECRET = "سليم";
const form = document.getElementById("searchFormNew");
const input = document.getElementById("searchInputNew");
const facade = document.getElementById("searchFacade");
const message = document.getElementById("searchMessage");
const lockScreen = document.getElementById("lockScreen");

form.addEventListener("submit", function(e){
  e.preventDefault();
  const q = input.value.trim();

  if(!q){
    message.textContent = "اكتب حاجة للبحث عنها";
    message.classList.add("show");
    setTimeout(() => message.classList.remove("show"), 2200);
    return;
  }

  if(q === SECRET){
    facade.classList.add("hide");
    setTimeout(() => {
      facade.style.display = "none";
      lockScreen.style.display = "flex";
      lockScreen.style.opacity = "1";
      lockScreen.style.filter = "none";
      lockScreen.style.transform = "none";
      
      const pass = document.getElementById("passInput");
      if(pass) setTimeout(() => pass.focus(), 150);
    }, 550);
    return;
  }

  window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
});

document.getElementById("luckyBtn").addEventListener("click", function(){
  const q = input.value.trim();
  if(q === SECRET){
    form.dispatchEvent(new Event('submit'));
    return;
  }
  if(q){
    window.location.href = "https://www.google.com/search?btnI=I&q=" + encodeURIComponent(q);
  } else {
    window.location.href = "https://www.google.com/doodles";
  }
});
</script>
</body>
</html>
