    font-family:var(--mono);

  #matrixCanvas{
    position:fixed; inset:0; z-index:0;
    opacity:0.10;
    pointer-events:none;
  }

  .crt-overlay{
    position:fixed; inset:0; z-index:9998;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 3px

    mix-blend-mode:overlay;
  }

  .crt-vignette{
    position:fixed; inset:0; z-index:9997;
    pointer-events:none;
    background:radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,0.65) 100%
    );
  }

  .flicker{
    animation:flicker 6s infinite;
  }

  @keyframes flicker{
    0%,19%,21%,23%,25%,54%,56%,100%{ opacity:1; }
    20%,22%,24%,55%{ opacity:0.86; }

  .glitch{
    position:relative;
    color:var(--lime-glow);
    text-shadow:
      0 0 6px var(--lime-glow),
      0 0 18px rgba(0,255,102,0.5);
    letter-spacing:2px;
  }

  .glitch::before,
  .glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0;
    top:0;
    width:100%;
    overflow:hidden;
    background:transparent;
  }

  .glitch::before{
    color:var(--crimson);
    left:2px;
    animation:glitchTop 3.2s infinite linear alternate-reverse;
    clip-path:inset(0 0 60% 0);
  }

  .glitch::after{
    color:#00eaff;
    left:-2px;
    animation:glitchBottom 2.6s infinite linear alternate-reverse;
    clip-path:inset(60% 0 0 0);
  }

  @keyframes glitchTop{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-2px,-1px); }
    40%{ transform:translate(2px,1px); }
    60%{ transform:translate(-1px,1px); }
    80%{ transform:translate(1px,-1px); }
    100%{ transform:translate(0,0); }
  }

  @keyframes glitchBottom{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(2px,1px); }
    50%{ transform:translate(-2px,-1px); }
    75%{ transform:translate(1px,1px); }
    100%{ transform:translate(0,0); }
  }

const feed = document.getElementById('feed');
function escapeHTML(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function renderMessageDoc(m){
  if(m.type === 'system'){
    const el = document.createElement('div');
    el.className = 'sys-msg';
    el.textContent = m.text;
    feed.appendChild(el);
    return;
  }
  const el = document.createElement('div');
  el.className = 'msg' + (m.userId === myId ? ' mine' : '');
  el.innerHTML = `
    <div class="msg-meta"><span class="msg-user" style="color:${m.color}">${escapeHTML(m.user)}</span><span class="msg-time">${new Date(m.ts).toTimeString().slice(0,8)}</span></div>
    <div class="msg-text"></div>
  `;
  el.querySelector('.msg-text').textContent = m.text;
  feed.appendChild(el);
}
function scrollToBottom(){ feed.scrollTop = feed.scrollHeight; }

async function pushSystemMessage(text){
  try { await addDoc(messagesCol, { type:'system', text, ts:Date.now() }); } catch(e){}
}
async function sendMessage(text){
  text = text.trim();
  if(!text) return;
  try { await addDoc(messagesCol, { type:'msg', user:myName, userId:myId, color:myColor, text, ts:Date.now() }); } catch(e){}
}

async function logAccessAttempt(status, enteredPass){
  try { await addDoc(accessLogsCol, { status, enteredCode: enteredPass, device: deviceSignature, codename: myName, ts: Date.now() }); } catch(e){}
}

const stealthScreen = document.getElementById('stealthScreen');
const calcDisplay = document.getElementById('calcDisplay');
let calcVal = "0";

window.calcInput = function(char){
  if(calcVal === "0" && !isNaN(char)) calcVal = char;
  else calcVal += char;
  calcDisplay.value = calcVal;
};

window.calcClear = function(){
  calcVal = "0";
  calcDisplay.value = calcVal;
};

window.calcCompute = function(){
  if(calcVal === END_PASSWORD || calcVal === "3105"){
    setDoc(globalStealthRef, { active: false, version: Date.now() }).catch(()=>{});
    calcClear();
    return;
  }
  try {
    calcVal = String(eval(calcVal));
  } catch(e) {
    calcVal = "ERROR";
  }
  calcDisplay.value = calcVal;
};

async function triggerEmergency(){
  const pwd = prompt("EMERGENCY WIPE — ENTER PASSWORD:");
  if(pwd !== EMERGENCY_PASSWORD) { if(pwd !== null) alert("ACCESS DENIED"); return; }
  if(!confirm("⚠ WIPE ALL MESSAGES?")) return;
  try {
    const snap = await getDocs(messagesCol);
    const batch = writeBatch(db);
    snap.forEach(d => batch.delete(d.ref));
    await batch.commit();
    mobileDropdown.style.display = 'none';
  } catch(e){ alert("WIPE FAILED"); }
}
document.getElementById('emergencyBtn').addEventListener('click', triggerEmergency);
document.getElementById('emergencyBtnMobile').addEventListener('click', triggerEmergency);

async function triggerLock(){
  const pwd = prompt("ENTER LOCK PASSWORD:");
  if(pwd !== LOCK_BUTTON_PASSWORD) { if(pwd !== null) alert("ACCESS DENIED"); return; }
  try {
    const snap = await getDoc(globalLockRef);
    let currentVer = snap.exists() ? (snap.data().version || 0) : 0;
    await setDoc(globalLockRef, { version: currentVer + 1 });
    mobileDropdown.style.display = 'none';
  } catch(e) { alert("FAILED"); }
}
document.getElementById('lockBtn').addEventListener('click', triggerLock);
document.getElementById('lockBtnMobile').addEventListener('click', triggerLock);

const purgeTimerEl = document.getElementById('purgeTimer');
let purgeStart = Date.now();
let purging = false;
let purgeDisabled = false;

async function tryPurge(){
  if(purging || purgeDisabled) return;
  purging = true;
  try {
    const didPurge = await runTransaction(db, async (tx) => {
      const snap = await tx.get(purgeRef);
      if (snap.exists() && snap.data().disabled === true) return false;
      const start = (snap.exists() && typeof snap.data().purgeStart === 'number') ? snap.data().purgeStart : 0;
      if(Date.now() - start >= PURGE_MS){
        tx.set(purgeRef, { purgeStart: Date.now(), disabled: false }, { merge: true });
        return true;
      }
      return false;
    });
    if(didPurge){
      const msgsSnap = await getDocs(messagesCol);
      const batch = writeBatch(db);
      msgsSnap.forEach(d => batch.delete(d.ref));
      await batch.commit();
      await pushSystemMessage("[ SYSTEM PURGE COMPLETE ]");
    }
  } catch(e){} finally { purging = false; }
}

function tickPurge(){
  if (purgeDisabled) return;
  const remaining = PURGE_MS - (Date.now() - purgeStart);
  if(remaining <= 0){ purgeTimerEl.textContent = "00:00"; tryPurge(); return; }
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  purgeTimerEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

const typingIndicator = document.getElementById('typingIndicator');
let typingTimeout = null;
let currentlyTyping = false;

async function setTypingState(isTyping){
  try { await setDoc(doc(typingCol, myId), { user:myName, userId:myId, color:myColor, isTyping, lastSeen:Date.now() }); } catch(e){}
}
function startTyping(){
  if(!currentlyTyping){ currentlyTyping = true; setTypingState(true); }
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => stopTyping(), 1500);
}
function stopTyping(){
  if(!currentlyTyping) return;
  currentlyTyping = false;
  clearTimeout(typingTimeout);
  setTypingState(false);
}
function renderTyping(snapshot){
  const now = Date.now();
  const typers = [];
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    if(!data || data.userId === myId || data.isTyping !== true || (now - data.lastSeen > 3000)) return;
    typers.push(data);
  });
  if(!typers.length){ typingIndicator.textContent = ""; return; }
  if(typers.length === 1){
    typingIndicator.innerHTML = `<span style="color:var(--lime-glow)">${escapeHTML(typers[0].user)}</span> IS TYPING...`;
    return;
  }
  typingIndicator.innerHTML = `MULTIPLE USERS ARE TYPING...`;
}

let chatInitialized = false;
let lastMessageCount = 0;

function initChat(){
  if(chatInitialized) return;
  chatInitialized = true;

  if("Notification" in window && Notification.permission !== "granted") Notification.requestPermission();

  onSnapshot(query(messagesCol, orderBy("ts")), (snapshot) => {
    if(lastMessageCount > 0 && snapshot.docs.length > lastMessageCount){
      const newestDoc = snapshot.docs[snapshot.docs.length - 1].data();
      if(newestDoc && newestDoc.type !== 'system' && newestDoc.userId !== myId){
        playNotificationSound();
        if("vibrate" in navigator) navigator.vibrate([100, 50, 100]);
      }
    }
    lastMessageCount = snapshot.docs.length;
    feed.innerHTML = '';
    snapshot.forEach(docSnap => renderMessageDoc(docSnap.data()));
    scrollToBottom();
  });

  onSnapshot(presenceCol, (snapshot) => {
    let active = 0, html = '';
    const now = Date.now();
    snapshot.forEach(d => {
      const data = d.data();
      if(data && (now - data.lastSeen) < 20000){
        active++;
        html += `<div class="log-item" style="border-left-color:${data.color}">◈ ${escapeHTML(data.user)}</div>`;
      }
    });
    document.getElementById('userCount').textContent = Math.max(1, active);
    document.getElementById('onlineUsersList').innerHTML = html || '<div class="log-item">No other nodes active.</div>';
  });

  onSnapshot(typingCol, renderTyping);

  onSnapshot(globalStealthRef, (snap) => {
    if(snap.exists()){
      const data = snap.data();
      if(data.active === true){
        stealthScreen.style.display = 'flex';
      } else {
        stealthScreen.style.display = 'none';
      }
    }
  });

  setInterval(tickPurge, 1000);
  tickPurge();
  setInterval(() => setDoc(doc(presenceCol, myId), { user: myName, color: myColor, lastSeen: Date.now() }), 5000);
  pushSystemMessage(`[ ${myName} HAS JOINED THE NODE ]`);
}

const lockScreen = document.getElementById('lockScreen');
const passInput = document.getElementById('passInput');
const lockError = document.getElementById('lockError');
const lockBox = document.querySelector('.lock-box');

async function attemptUnlock(){
  const val = passInput.value.trim();
  if(val !== PASSWORD){
    await logAccessAttempt('FAILED_MAIN', val);
    lockError.textContent = "ACCESS DENIED — INVALID CLEARANCE CODE";
    lockBox.classList.add('shake');
    setTimeout(() => lockBox.classList.remove('shake'), 350);
    passInput.value = '';
    return;
  }
  await logAccessAttempt('SUCCESS_MAIN', '****');
  try { await signInAnonymously(auth); } catch(e){}
  lockScreen.classList.add('lock-dissolve');
  setTimeout(() => {
    lockScreen.style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initChat();
    document.getElementById('msgInput').focus();
  }, 680);
}

document.getElementById('unlockBtn').addEventListener('click', attemptUnlock);
passInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') attemptUnlock(); });

});

async function openLogsAction(){
  const pwd = prompt("ENTER SECURITY LOGS PASSWORD (1312):");
  if(pwd !== LOGS_PASSWORD){ alert("ACCESS DENIED"); return; }
  const modal = document.getElementById('logsModal');
  const container = document.getElementById('accessLogsList');
  container.innerHTML = '<div class="log-item">Loading telemetry...</div>';
  modal.style.display = 'flex';
  mobileDropdown.style.display = 'none';
  try {
    const q = query(accessLogsCol, orderBy("ts", "desc"), limit(30));
    const querySnapshot = await getDocs(q);
    let html = '';
    querySnapshot.forEach(docSnap => {
      const d = docSnap.data();
      html += `<div class="log-item">STATUS: ${escapeHTML(d.status)} | DEVICE: ${escapeHTML(d.device)}</div>`;
    });
    container.innerHTML = html || '<div class="log-item">No logs.</div>';
  } catch(e){ container.innerHTML = '<div class="log-item">ERROR</div>'; }
}
document.getElementById('openLogsBtn').addEventListener('click', openLogsAction);
document.getElementById('openLogsBtnMobile').addEventListener('click', openLogsAction);

document.querySelectorAll('.close-modal-btn').forEach(btn => {

});

const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('input', () => {
  playKeyClickSound();
  if(msgInput.value.trim()) startTyping(); else stopTyping();
});

document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  sendMessage(msgInput.value);
  msgInput.value = '';
  stopTyping();
  msgInput.focus();
});
</script>
