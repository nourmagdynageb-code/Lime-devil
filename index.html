<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>LIME DEVIL // encrypted terminal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />

  <style>
    :root{
      --bg:#030503;
      --panel:#071007;
      --panel2:#0a120a;

      --lime:#39FF14;
      --lime-dim:#1ca00c;
      --lime-soft:#79ff62;

      --red:#ff1744;
      --cyan:#00eaff;

      --text:#d8ffd1;
      --muted:#557653;

      --border:rgba(57,255,20,.25);
      --border-strong:rgba(57,255,20,.55);

      --shadow:0 0 20px rgba(57,255,20,.08);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      overflow:hidden;
    }

    body{
      font-family:"JetBrains Mono",monospace;
    }

    button,
    input{
      font:inherit;
    }

    #app{
      width:100%;
      height:100dvh;
      min-height:100dvh;

      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto auto;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(57,255,20,.08),
          transparent 45%
        ),
        var(--bg);

      position:relative;
      overflow:hidden;
    }

    #app::before{
      content:"";
      position:absolute;
      inset:0;

      pointer-events:none;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.018) 0,
          rgba(255,255,255,.018) 1px,
          transparent 1px,
          transparent 4px
        );

      opacity:.35;
      z-index:20;
    }

    header{
      position:relative;
      z-index:2;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

      padding:
        calc(10px + env(safe-area-inset-top))
        14px
        10px;

      border-bottom:1px solid var(--border);

      background:rgba(3,5,3,.92);
      box-shadow:var(--shadow);
    }

    .brand{
      min-width:0;
    }

    .title{
      color:var(--lime);
      font-family:"Share Tech Mono",monospace;
      font-size:clamp(18px,5vw,27px);
      letter-spacing:2px;
      line-height:1;
      text-shadow:0 0 10px rgba(57,255,20,.35);

      white-space:nowrap;
    }

    .subtitle{
      margin-top:5px;
      color:var(--muted);
      font-size:9px;
      letter-spacing:1.4px;
      white-space:nowrap;
    }

    .status{
      flex:none;

      color:var(--lime);
      border:1px solid var(--border);
      padding:7px 9px;

      font-size:9px;
      letter-spacing:1px;

      text-align:center;

      background:rgba(57,255,20,.025);
    }

    #userCount{
      color:var(--lime-soft);
      font-weight:700;
    }

    #feed{
      position:relative;
      z-index:1;

      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;

      display:flex;
      flex-direction:column;
      gap:8px;

      padding:14px 12px 10px;

      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;

      scrollbar-width:thin;
      scrollbar-color:var(--lime-dim) transparent;
    }

    #feed::-webkit-scrollbar{
      width:5px;
    }

    #feed::-webkit-scrollbar-track{
      background:transparent;
    }

    #feed::-webkit-scrollbar-thumb{
      background:var(--lime-dim);
    }

    #messageList{
      display:flex;
      flex-direction:column;
      gap:8px;
      width:100%;
    }

    .message{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:3px;

      animation:messageIn .16s ease-out;
    }

    @keyframes messageIn{
      from{
        opacity:0;
        transform:translateY(3px);
      }

      to{
        opacity:1;
        transform:none;
      }
    }

    .message-head{
      display:flex;
      align-items:center;
      gap:7px;

      font-size:9px;
      color:var(--muted);
    }

    .message-name{
      font-weight:700;
      letter-spacing:.7px;
    }

    .message-time{
      opacity:.65;
    }

    .message-body{
      width:fit-content;
      max-width:min(90%,760px);

      padding:8px 10px;

      border:1px solid var(--border);
      background:rgba(57,255,20,.025);

      color:var(--text);

      font-size:12px;
      line-height:1.55;

      white-space:pre-wrap;
      overflow-wrap:anywhere;
      word-break:break-word;

      direction:auto;
      unicode-bidi:plaintext;
      text-align:start;

      box-shadow:0 0 12px rgba(57,255,20,.025);
    }

    .system{
      align-self:center;

      width:100%;
      text-align:center;

      color:var(--muted);

      font-size:9px;
      letter-spacing:1px;

      direction:auto;
      unicode-bidi:plaintext;
    }

    .system-text{
      display:inline-block;

      padding:4px 9px;

      border:1px dashed rgba(57,255,20,.18);

      background:rgba(57,255,20,.015);
    }

    .typing-indicator{
      flex:none;

      align-self:center;

      color:var(--lime-dim);

      font-size:9px;
      letter-spacing:1px;

      border:1px dashed rgba(57,255,20,.3);

      padding:5px 12px;
      margin:0 0 4px;

      background:rgba(57,255,20,.025);

      direction:auto;
      unicode-bidi:plaintext;
      text-align:center;

      animation:typingPulse 1.2s infinite;
    }

    @keyframes typingPulse{
      0%,
      100%{
        opacity:1;
      }

      50%{
        opacity:.4;
      }
    }

    .typing-dots::after{
      content:"";
      animation:typingDots 1.2s steps(4,end) infinite;
    }

    @keyframes typingDots{
      0%{content:"";}
      25%{content:".";}
      50%{content:"..";}
      75%{content:"...";}
      100%{content:"";}
    }

    #composer{
      position:relative;
      z-index:3;

      display:flex;
      gap:8px;

      padding:
        8px
        10px
        calc(8px + env(safe-area-inset-bottom));

      border-top:1px solid var(--border);

      background:rgba(3,5,3,.96);
    }

    #msgInput{
      min-width:0;
      flex:1;

      height:44px;

      border:1px solid var(--border-strong);
      outline:none;

      border-radius:0;

      background:var(--panel);
      color:var(--text);

      padding:0 11px;

      font-size:16px;
      line-height:44px;

      direction:auto;
      unicode-bidi:plaintext;
      text-align:start;

      caret-color:var(--lime);

      box-shadow:
        inset 0 0 12px rgba(57,255,20,.025);
    }

    #msgInput::placeholder{
      color:#426140;
      opacity:1;
    }

    #msgInput:focus{
      border-color:var(--lime);

      box-shadow:
        0 0 12px rgba(57,255,20,.08),
        inset 0 0 12px rgba(57,255,20,.025);
    }

    #sendBtn{
      flex:none;

      height:44px;
      min-width:88px;

      border:1px solid var(--lime);

      background:rgba(57,255,20,.06);
      color:var(--lime);

      cursor:pointer;

      font-family:"Share Tech Mono",monospace;
      font-size:13px;
      letter-spacing:1px;

      transition:
        background .12s ease,
        color .12s ease,
        opacity .12s ease;
    }

    #sendBtn:hover{
      background:var(--lime);
      color:#000;
    }

    #sendBtn:active{
      transform:translateY(1px);
    }

    #sendBtn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .footnote{
      position:relative;
      z-index:2;

      padding:
        0
        10px
        calc(5px + env(safe-area-inset-bottom));

      color:#355633;

      font-size:8px;
      letter-spacing:1px;

      text-align:center;

      background:rgba(3,5,3,.96);
    }

    @media(max-width:600px){
      header{
        padding-left:10px;
        padding-right:10px;
      }

      .subtitle{
        display:none;
      }

      .status{
        font-size:8px;
        padding:6px 7px;
      }

      #feed{
        padding:10px 8px 8px;
      }

      .message-body{
        max-width:94%;
        font-size:13px;
      }

      #composer{
        gap:6px;
        padding-left:7px;
        padding-right:7px;
      }

      #sendBtn{
        min-width:78px;
        font-size:12px;
      }
    }

    @media(max-width:380px){
      .title{
        font-size:17px;
        letter-spacing:1px;
      }

      #sendBtn{
        min-width:68px;
        padding:0 7px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <header>
    <div class="brand">
      <div class="title">LIME DEVIL</div>
      <div class="subtitle">// ENCRYPTED TERMINAL</div>
    </div>

    <div class="status">
      <span id="userCount">1</span> ONLINE
    </div>
  </header>

  <main id="feed">
    <div id="messageList"></div>

    <div
      id="typingIndicator"
      class="typing-indicator"
      hidden
      aria-live="polite"
    ></div>
  </main>

  <form
    id="composer"
    autocomplete="off"
    novalidate
  >
    <input
      type="text"
      id="msgInput"
      placeholder="transmit a message... [ENTER to send]"
      maxlength="500"
      autocomplete="off"
      autocapitalize="sentences"
      autocorrect="on"
      spellcheck="true"
      enterkeyhint="send"
      inputmode="text"
      dir="auto"
      aria-label="Message"
    >

    <button
      type="submit"
      id="sendBtn"
    >
      SEND ▶
    </button>
  </form>

  <div class="footnote">
    AUTO-WIPE EVERY 10 MIN // CLIENT PURGE NODE ACTIVE
  </div>

</div>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    doc,
    setDoc,
    deleteDoc,
    onSnapshot,
    query,
    orderBy,
    runTransaction,
    getDocs,
    writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import {
    getAuth,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  /* =========================================================
     FIREBASE
  ========================================================= */

  const firebaseConfig = {
    apiKey: "AIzaSyAqnFPJaj130JWZpURTDmgKwmBU0anjNFA",
    authDomain: "limedevil-d3725.firebaseapp.com",
    projectId: "limedevil-d3725",
    storageBucket: "limedevil-d3725.firebasestorage.app",
    messagingSenderId: "678313318556",
    appId: "1:678313318556:web:b0d4207b086319c05cf559",
    measurementId: "G-BHJ50N5NNZ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);


  /* =========================================================
     COLLECTIONS
  ========================================================= */

  const messagesCol = collection(db, "messages");
  const presenceCol = collection(db, "presence");
  const purgeRef = doc(db, "meta", "purge");


  /* =========================================================
     CONFIG
  ========================================================= */

  const PASSWORD = "1280";

  // IMPORTANT:
  // 10 MINUTES — DO NOT CHANGE TO 30.
  const PURGE_MS = 10 * 60 * 1000;

  const PRESENCE_STALE_MS = 20000;
  const TYPING_STALE_MS = 4000;

  const NAME_COLORS = [
    "#39FF14",
    "#ff1744",
    "#00eaff",
    "#ffd600",
    "#ff6e40",
    "#b388ff",
    "#00FF66",
    "#ff4081"
  ];


  /* =========================================================
     DOM
  ========================================================= */

  const feed = document.getElementById("feed");
  const messageList = document.getElementById("messageList");
  const typingIndicator = document.getElementById("typingIndicator");

  const composer = document.getElementById("composer");
  const msgInput = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");

  const userCountEl = document.getElementById("userCount");


  /* =========================================================
     IDENTITY
  ========================================================= */

  const PREFIXES = [
    "LIME",
    "VOID",
    "CYBER",
    "NEON",
    "GHOST",
    "DARK",
    "ZERO",
    "NOVA",
    "RUST",
    "BYTE",
    "GLITCH",
    "SHADOW"
  ];

  const SUFFIXES = [
    "DEVIL",
    "WOLF",
    "CORE",
    "NODE",
    "FOX",
    "BYTE",
    "X",
    "404",
    "ZERO",
    "GHOST",
    "LORD",
    "UNIT"
  ];

  function randomItem(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function randomHex(length = 6){
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let result = "";

    for(let i = 0; i < length; i++){
      result += chars[Math.floor(Math.random() * chars.length)];
    }

    return result;
  }

  const myName =
    `${randomItem(PREFIXES)}_${randomItem(SUFFIXES)}_${randomHex(2)}`;

  const myColor = randomItem(NAME_COLORS);

  const myId =
    `${myName}_${randomHex(8)}`;


  /* =========================================================
     STATE
  ========================================================= */

  let sendingMessage = false;

  let isComposing = false;
  let compositionJustEndedAt = 0;

  let chatInitialized = false;

  let typingActive = false;
  let typingStopTimer = null;
  let typingPulseTimer = null;

  let presenceCache = new Map();


  /* =========================================================
     TEXT
  ========================================================= */

  function normalizeMessage(value){

    if(typeof value !== "string"){
      return "";
    }

    return value
      .normalize("NFC")
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n");
  }


  /* =========================================================
     SCROLL
  ========================================================= */

  function scrollToBottom(){

    requestAnimationFrame(() => {

      feed.scrollTop = feed.scrollHeight;

    });

  }


  /* =========================================================
     MESSAGE RENDER
  ========================================================= */

  function renderMessageDoc(m){

    if(!m){
      return;
    }

    const type = m.type || "msg";

    if(type === "system"){

      const wrapper = document.createElement("div");

      wrapper.className = "system";

      const text = document.createElement("div");

      text.className = "system-text";

      text.textContent = m.text || "";

      wrapper.appendChild(text);

      messageList.appendChild(wrapper);

      return;
    }


    const message = document.createElement("div");

    message.className = "message";


    const head = document.createElement("div");

    head.className = "message-head";


    const name = document.createElement("span");

    name.className = "message-name";

    name.textContent = m.user || "UNKNOWN";

    if(m.color){
      name.style.color = m.color;
    }


    const time = document.createElement("span");

    time.className = "message-time";

    if(typeof m.ts === "number"){

      try{

        time.textContent =
          new Date(m.ts).toLocaleTimeString([], {
            hour:"2-digit",
            minute:"2-digit"
          });

      }catch{
        time.textContent = "";
      }

    }


    head.appendChild(name);
    head.appendChild(time);


    const body = document.createElement("div");

    body.className = "message-body";

    body.textContent = normalizeMessage(m.text || "");


    message.appendChild(head);
    message.appendChild(body);

    messageList.appendChild(message);
  }


  /* =========================================================
     SYSTEM MESSAGE
  ========================================================= */

  async function pushSystemMessage(text){

    const now = Date.now();

    try{

      await addDoc(messagesCol, {
        type: "system",
        text: normalizeMessage(text),
        ts: now,
        expiresAt: new Date(now + PURGE_MS)
      });

    }catch(e){

      console.error("system message error:", e);

    }

  }


  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  async function sendMessage(rawText){

    if(sendingMessage){
      return false;
    }

    const text = normalizeMessage(rawText).trim();

    if(!text){
      return false;
    }


    sendingMessage = true;

    sendBtn.disabled = true;


    const now = Date.now();


    try{

      await addDoc(messagesCol, {

        type: "msg",

        user: myName,
        userId: myId,
        color: myColor,

        text,

        ts: now,

        expiresAt: new Date(now + PURGE_MS)

      });


      return true;

    }catch(e){

      console.error("send message error:", e);

      return false;

    }finally{

      sendingMessage = false;

      sendBtn.disabled = false;

    }

  }


  /* =========================================================
     PRESENCE
  ========================================================= */

  async function heartbeat(){

    try{

      /*
        IMPORTANT:

        merge:true prevents heartbeat from deleting
        typing / name / color fields.
      */

      await setDoc(
        doc(presenceCol, myId),
        {
          lastSeen: Date.now(),
          name: myName,
          color: myColor
        },
        {
          merge: true
        }
      );

    }catch(e){

      console.error("heartbeat error:", e);

    }

  }


  /* =========================================================
     TYPING STATE
  ========================================================= */

  async function writeTypingState(typing){

    if(!myId){
      return;
    }

    const now = Date.now();

    try{

      await setDoc(
        doc(presenceCol, myId),
        {
          lastSeen: now,

          name: myName,
          color: myColor,

          typing: !!typing,

          typingAt: typing ? now : 0

        },
        {
          merge: true
        }
      );

    }catch(e){

      console.error("typing state error:", e);

    }

  }


  function startTyping(){

    if(!typingActive){

      typingActive = true;

      writeTypingState(true);

    }


    clearTimeout(typingStopTimer);


    /*
      If the user continues typing for a long time,
      keep refreshing typingAt so other clients know
      the indicator is still alive.
    */

    if(!typingPulseTimer){

      typingPulseTimer = setInterval(() => {

        if(typingActive){

          writeTypingState(true);

        }

      }, 1500);

    }


    typingStopTimer = setTimeout(() => {

      stopTyping();

    }, 2500);

  }


  async function stopTyping(){

    clearTimeout(typingStopTimer);

    typingStopTimer = null;


    if(typingPulseTimer){

      clearInterval(typingPulseTimer);

      typingPulseTimer = null;

    }


    if(!typingActive){
      return;
    }


    typingActive = false;

    await writeTypingState(false);

  }


  /* =========================================================
     TYPING UI
  ========================================================= */

  function refreshPresenceUI(){

    const now = Date.now();

    let active = 0;

    const typingNames = [];


    presenceCache.forEach((data, id) => {

      if(!data){
        return;
      }


      const lastSeen = data.lastSeen;

      const activeNow =
        typeof lastSeen === "number" &&
        now - lastSeen < PRESENCE_STALE_MS;


      if(activeNow){

        active++;

      }


      const typingNow =
        id !== myId &&

        activeNow &&

        data.typing === true &&

        typeof data.typingAt === "number" &&

        now - data.typingAt < TYPING_STALE_MS;


      if(typingNow){

        typingNames.push(
          typeof data.name === "string"
            ? data.name
            : "UNKNOWN"
        );

      }

    });


    /*
      Keep at least 1 because the current client
      is online even if its snapshot has not arrived yet.
    */

    userCountEl.textContent =
      Math.max(1, active);


    renderTypingIndicator(typingNames);

  }


  function renderTypingIndicator(names){

    if(!names.length){

      typingIndicator.hidden = true;

      typingIndicator.textContent = "";

      return;

    }


    let text;


    if(names.length === 1){

      text =
        `[ ${names[0]} IS TYPING`;

    }else{

      const visibleNames =
        names.slice(0, 3);

      text =
        `[ ${visibleNames.join(", ")} ARE TYPING`;

      if(names.length > 3){

        text += ` +${names.length - 3}`;

      }

    }


    typingIndicator.textContent = text;


    const dots = document.createElement("span");

    dots.className = "typing-dots";

    typingIndicator.appendChild(dots);


    typingIndicator.appendChild(
      document.createTextNode(" ]")
    );


    typingIndicator.hidden = false;

  }


  /* =========================================================
     INPUT / ANDROID IME
  ========================================================= */

  msgInput.addEventListener(
    "compositionstart",
    () => {

      isComposing = true;

    }
  );


  msgInput.addEventListener(
    "compositionend",
    () => {

      isComposing = false;

      compositionJustEndedAt = Date.now();

    }
  );


  /*
    Do NOT force isComposing=true from beforeinput.

    Android keyboards can emit composition events in
    different orders. The combination of:
      - composition events
      - e.isComposing
      - keyCode 229
    is safer.
  */


  msgInput.addEventListener(
    "keydown",
    (e) => {

      if(e.key !== "Enter"){
        return;
      }


      /*
        Android IME may send Enter as keyCode 229
        while composition is still active.
      */

      if(
        isComposing ||
        e.isComposing ||
        e.keyCode === 229
      ){

        return;

      }


      /*
        Tiny protection against an Enter event arriving
        immediately after compositionend.
      */

      if(
        Date.now() - compositionJustEndedAt < 120
      ){

        return;

      }


      e.preventDefault();


      if(
        !sendingMessage &&
        msgInput.value.trim()
      ){

        composer.requestSubmit();

      }

    }
  );


  msgInput.addEventListener(
    "input",
    () => {

      /*
        Let the browser decide Arabic/LTR direction
        automatically.
      */

      msgInput.dir = "auto";


      /*
        Actual typing detection.
      */

      if(msgInput.value.trim()){

        startTyping();

      }else{

        stopTyping();

      }

    }
  );


  /* =========================================================
     COMPOSER
  ========================================================= */

  composer.addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();


      if(isComposing){
        return;
      }


      if(sendingMessage){
        return;
      }


      const text = msgInput.value;


      if(!text.trim()){

        stopTyping();

        return;

      }


      const success =
        await sendMessage(text);


      if(success){

        /*
          Clear ONLY after Firebase accepted the message.
        */

        msgInput.value = "";

        msgInput.dir = "auto";


        /*
          Stop typing indicator after successful send.
        */

        stopTyping();


        requestAnimationFrame(() => {

          try{

            msgInput.focus({
              preventScroll:true
            });

          }catch{

            msgInput.focus();

          }

        });

      }

    }
  );


  /* =========================================================
     MESSAGES LISTENER
  ========================================================= */

  const messagesQuery =
    query(
      messagesCol,
      orderBy("ts")
    );


  function listenToMessages(){

    onSnapshot(
      messagesQuery,
      (snapshot) => {

        /*
          IMPORTANT:

          Only clear messageList.
          Do NOT clear feed because typingIndicator
          lives inside feed.
        */

        messageList.innerHTML = "";


        snapshot.forEach(
          (docSnap) => {

            renderMessageDoc(
              docSnap.data()
            );

          }
        );


        scrollToBottom();

      },
      (err) => {

        console.error(
          "messages listener error:",
          err
        );

      }
    );

  }


  /* =========================================================
     PRESENCE LISTENER
  ========================================================= */

  function listenToPresence(){

    onSnapshot(
      presenceCol,
      (snapshot) => {

        presenceCache = new Map();


        snapshot.forEach(
          (docSnap) => {

            presenceCache.set(
              docSnap.id,
              docSnap.data()
            );

          }
        );


        refreshPresenceUI();

      },
      (err) => {

        console.error(
          "presence listener error:",
          err
        );

      }
    );

  }


  /* =========================================================
     PURGE
  ========================================================= */

  async function deleteAllMessagesInBatches(){

    try{

      const snapshot =
        await getDocs(messagesCol);


      if(snapshot.empty){
        return;
      }


      const docs =
        snapshot.docs;


      /*
        Firestore batch limit is 500.
        Stay below it.
      */

      const CHUNK_SIZE = 450;


      for(
        let i = 0;
        i < docs.length;
        i += CHUNK_SIZE
      ){

        const batch = writeBatch(db);

        const chunk =
          docs.slice(
            i,
            i + CHUNK_SIZE
          );


        chunk.forEach(
          (docSnap) => {

            batch.delete(docSnap.ref);

          }
        );


        await batch.commit();

      }

    }catch(e){

      console.error(
        "delete messages error:",
        e
      );

    }

  }


  async function tryPurge(){

    const now = Date.now();


    try{

      let shouldPurge = false;


      await runTransaction(
        db,
        async (transaction) => {

          const snap =
            await transaction.get(purgeRef);


          const data =
            snap.exists()
              ? snap.data()
              : null;


          const purgeStart =
            data &&
            typeof data.purgeStart === "number"
              ? data.purgeStart
              : 0;


          if(
            !purgeStart ||
            now - purgeStart >= PURGE_MS
          ){

            transaction.set(
              purgeRef,
              {
                purgeStart: now
              },
              {
                merge:true
              }
            );


            shouldPurge = true;

          }

        }
      );


      if(!shouldPurge){
        return;
      }


      await deleteAllMessagesInBatches();


      await pushSystemMessage(
        "[ SYSTEM PURGE COMPLETE — ALL TRAFFIC LOGS WIPED ]"
      );


    }catch(e){

      console.error(
        "purge error:",
        e
      );

    }

  }


  /* =========================================================
     PURGE COUNTDOWN
  ========================================================= */

  let purgeStartTime = null;


  function tickPurge(){

    if(typeof purgeStartTime !== "number"){
      return;
    }


    const now = Date.now();

    const elapsed =
      now - purgeStartTime;


    let remaining =
      PURGE_MS - elapsed;


    if(remaining < 0){
      remaining = 0;
    }


    const totalSeconds =
      Math.ceil(
        remaining / 1000
      );


    const minutes =
      Math.floor(
        totalSeconds / 60
      );


    const seconds =
      totalSeconds % 60;


    const footnote =
      document.querySelector(".footnote");


    if(footnote){

      footnote.textContent =
        `AUTO-WIPE EVERY 10 MIN // NEXT PURGE ${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

    }


    /*
      When countdown reaches zero,
      immediately try to become the purge client.
    */

    if(remaining <= 0){

      tryPurge();

    }

  }


  function listenToPurge(){

    onSnapshot(
      purgeRef,
      (snapshot) => {

        if(!snapshot.exists()){

          /*
            No purge document yet.
            Create one through transaction.
          */

          tryPurge();

          return;

        }


        const data =
          snapshot.data();


        if(
          data &&
          typeof data.purgeStart === "number"
        ){

          purgeStartTime =
            data.purgeStart;

        }


        tickPurge();

      },
      (err) => {

        console.error(
          "purge listener error:",
          err
        );

      }
    );

  }


  /* =========================================================
     AUTH
  ========================================================= */

  async function authenticate(){

    try{

      await signInAnonymously(auth);

      return true;

    }catch(e){

      console.error(
        "anonymous auth error:",
        e
      );

      return false;

    }

  }


  /* =========================================================
     INIT CHAT
  ========================================================= */

  async function initChat(){

    if(chatInitialized){
      return;
    }

    chatInitialized = true;


    listenToMessages();

    listenToPresence();

    listenToPurge();


    /*
      Presence heartbeat.
    */

    await heartbeat();


    setInterval(
      heartbeat,
      5000
    );


    /*
      Refresh presence/typing UI every second.

      This is important because a typing timestamp can
      become stale even if no new Firestore snapshot arrives.
    */

    setInterval(
      refreshPresenceUI,
      1000
    );


    /*
      Purge countdown.
    */

    setInterval(
      tickPurge,
      1000
    );


    /*
      Try purge immediately.
    */

    tryPurge();


    /*
      Join message.
    */

    await pushSystemMessage(
      `[ ${myName} HAS JOINED THE NODE ]`
    );


    /*
      Focus input after startup.
    */

    requestAnimationFrame(() => {

      try{

        msgInput.focus({
          preventScroll:true
        });

      }catch{

        msgInput.focus();

      }

    });

  }


  /* =========================================================
     CLEANUP
  ========================================================= */

  async function cleanupPresence(){

    try{

      /*
        Stop typing first.
      */

      await stopTyping();


      /*
        Remove presence document completely.
      */

      await deleteDoc(
        doc(
          presenceCol,
          myId
        )
      );

    }catch(e){

      console.error(
        "presence cleanup error:",
        e
      );

    }

  }


  window.addEventListener(
    "beforeunload",
    () => {

      /*
        Fire-and-forget.
        Browser may terminate network requests during unload.
      */

      cleanupPresence();

    }
  );


  document.addEventListener(
    "visibilitychange",
    () => {

      if(document.visibilityState === "visible"){

        heartbeat();


        if(
          msgInput.value.trim()
        ){

          startTyping();

        }

      }else{

        /*
          Don't leave a false typing indicator
          when the tab goes to background.
        */

        stopTyping();

      }

    }
  );


  /* =========================================================
     START
  ========================================================= */

  const authenticated =
    await authenticate();


  if(authenticated){

    await initChat();

  }else{

    messageList.innerHTML = "";

    const error = document.createElement("div");

    error.className = "system";

    const text = document.createElement("div");

    text.className = "system-text";

    text.textContent =
      "[ AUTHENTICATION FAILED — CHECK FIREBASE CONFIG / AUTH ]";

    error.appendChild(text);

    messageList.appendChild(error);

  }

</script>

</body>
