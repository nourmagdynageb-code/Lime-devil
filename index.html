<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LIME DEVIL // encrypted terminal</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700;800&display=swap');

  :root{
    --void:#050505;
    --panel:#0c0f0c;
    --panel-2:#111511;
    --lime:#39FF14;
    --lime-dim:#1c8a0c;
    --lime-glow:#00FF66;
    --crimson:#ff1744;
    --crimson-dim:#7a0a1d;
    --text:#c9ffcf;
    --mono:'JetBrains Mono','Share Tech Mono','Courier New',monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--void);
    color:var(--text);
    font-family:var(--mono);
    overflow:hidden;
  }

  #matrixCanvas{
    position:fixed; inset:0; z-index:0;
    opacity:0.10;
    pointer-events:none;
  }

  .crt-overlay{
    position:fixed; inset:0; z-index:9998;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode:overlay;
  }

  .crt-vignette{
    position:fixed; inset:0; z-index:9997;
    pointer-events:none;
    background:radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,0.65) 100%
    );
  }

  .flicker{
    animation:flicker 6s infinite;
  }

  @keyframes flicker{
    0%,19%,21%,23%,25%,54%,56%,100%{ opacity:1; }
    20%,22%,24%,55%{ opacity:0.86; }
  }

  .glitch{
    position:relative;
    color:var(--lime-glow);
    text-shadow:
      0 0 6px var(--lime-glow),
      0 0 18px rgba(0,255,102,0.5);
    letter-spacing:2px;
  }

  .glitch::before,
  .glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0;
    top:0;
    width:100%;
    overflow:hidden;
    background:transparent;
  }

  .glitch::before{
    color:var(--crimson);
    left:2px;
    animation:glitchTop 3.2s infinite linear alternate-reverse;
    clip-path:inset(0 0 60% 0);
  }

  .glitch::after{
    color:#00eaff;
    left:-2px;
    animation:glitchBottom 2.6s infinite linear alternate-reverse;
    clip-path:inset(60% 0 0 0);
  }

  @keyframes glitchTop{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-2px,-1px); }
    40%{ transform:translate(2px,1px); }
    60%{ transform:translate(-1px,1px); }
    80%{ transform:translate(1px,-1px); }
    100%{ transform:translate(0,0); }
  }

  @keyframes glitchBottom{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(2px,1px); }
    50%{ transform:translate(-2px,-1px); }
    75%{ transform:translate(1px,1px); }
    100%{ transform:translate(0,0); }
  }

  /* ================= LOCK SCREEN ================= */

  #lockScreen{
    position:fixed; inset:0; z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(
        ellipse at 50% 20%,
        rgba(57,255,20,0.06),
        transparent 60%
      ),
      var(--void);
  }

  .lock-box{
    width:min(92vw, 460px);
    background:linear-gradient(180deg, var(--panel), #08090a);
    border:1px solid var(--lime-dim);
    border-radius:6px;
    padding:34px 30px 30px;
    box-shadow:
      0 0 40px rgba(57,255,20,0.12),
      inset 0 0 30px rgba(0,0,0,0.6);
    position:relative;
  }

  .lock-box::before{
    content:'';
    position:absolute;
    inset:-1px;
    border-radius:6px;
    padding:1px;
    background:linear-gradient(
      135deg,
      var(--lime),
      transparent 40%,
      var(--crimson-dim)
    );
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0.5;
    pointer-events:none;
  }

  .lock-title{
    font-size:clamp(28px,6vw,40px);
    font-weight:800;
    text-align:center;
    margin-bottom:6px;
  }

  .lock-sub{
    text-align:center;
    color:var(--lime-dim);
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:22px;
    text-transform:uppercase;
  }

  .hint-line{
    background:rgba(255,23,68,0.06);
    border:1px dashed var(--crimson-dim);
    color:var(--crimson);
    font-size:12px;
    padding:8px 10px;
    border-radius:4px;
    margin-bottom:20px;
    text-align:center;
    letter-spacing:1px;
    animation:pulseHint 2.4s infinite;
  }

  @keyframes pulseHint{
    0%,100%{ box-shadow:0 0 0 rgba(255,23,68,0); }
    50%{ box-shadow:0 0 14px rgba(255,23,68,0.35); }
  }

  .pass-row{
    display:flex;
    gap:8px;
  }

  #passInput{
    flex:1;
    background:#050805;
    border:1px solid var(--lime-dim);
    border-radius:4px;
    color:var(--lime-glow);
    font-family:var(--mono);
    font-size:18px;
    letter-spacing:6px;
    text-align:center;
    padding:14px 10px;
    outline:none;
    transition:box-shadow 0.15s, border-color 0.15s;
  }

  #passInput:focus{
    border-color:var(--lime-glow);
    box-shadow:0 0 16px rgba(0,255,102,0.5);
  }

  #unlockBtn{
    background:var(--lime);
    border:none;
    color:#031403;
    font-family:var(--mono);
    font-weight:800;
    padding:0 18px;
    border-radius:4px;
    cursor:pointer;
    letter-spacing:1px;
    transition:transform 0.1s, box-shadow 0.15s;
  }

  #unlockBtn:hover{
    box-shadow:0 0 18px rgba(57,255,20,0.6);
    transform:translateY(-1px);
  }

  .lock-error{
    margin-top:12px;
    text-align:center;
    color:var(--crimson);
    font-size:12px;
    min-height:16px;
    letter-spacing:1px;
  }

  .shake{
    animation:shake 0.35s;
  }

  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(5px); }
  }

  .lock-dissolve{
    animation:dissolveOut 0.7s forwards;
  }

  @keyframes dissolveOut{
    0%{ opacity:1; filter:blur(0) brightness(1); }
    40%{ opacity:0.7; filter:blur(2px) brightness(3) hue-rotate(30deg); }
    100%{ opacity:0; filter:blur(10px) brightness(0.2); transform:scale(1.04); }
  }

  /* ================= APP LAYOUT ================= */

  #app{
    position:relative;
    z-index:1;
    display:none;
    flex-direction:column;
    height:100vh;
    animation:fadeIn 0.6s ease;
  }

  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 18px;
    background:linear-gradient(180deg, #0a0c0a, #060706);
    border-bottom:1px solid var(--lime-dim);
    flex-wrap:wrap;
  }

  .logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
  }

  .header-stats{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:12px;
    flex-wrap:wrap;
  }

  .stat-chip{
    background:var(--panel-2);
    border:1px solid var(--lime-dim);
    border-radius:20px;
    padding:6px 12px;
    display:flex;
    align-items:center;
    gap:6px;
    letter-spacing:1px;
  }

  .stat-chip.clickable {
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .stat-chip.clickable:hover {
    border-color: var(--lime-glow);
    box-shadow: 0 0 10px rgba(0,255,102,0.3);
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--lime-glow);
    box-shadow:0 0 8px var(--lime-glow);
    animation:blink 1.6s infinite;
  }

  @keyframes blink{
    50%{ opacity:0.25; }
  }

  #purgeTimer{
    color:var(--crimson);
    text-shadow:0 0 8px rgba(255,23,68,0.7);
    font-weight:700;
  }

  #emergencyBtn{
    background:var(--crimson);
    border:1px solid var(--crimson);
    color:#fff;
    font-family:var(--mono);
    font-weight:800;
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    letter-spacing:1px;
    box-shadow:0 0 10px rgba(255,23,68,0.35);
    transition:transform 0.1s, box-shadow 0.15s;
  }

  #emergencyBtn:hover{
    box-shadow:0 0 18px rgba(255,23,68,0.75);
    transform:translateY(-1px);
  }

  #emergencyBtn:disabled{
    opacity:0.55;
    cursor:not-allowed;
    transform:none;
  }

  main{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    scroll-behavior:smooth;
  }

  main::-webkit-scrollbar{ width:8px; }
  main::-webkit-scrollbar-thumb{ background:var(--lime-dim); border-radius:4px; }
  main::-webkit-scrollbar-track{ background:transparent; }

  .sys-msg{
    align-self:center;
    color:var(--lime-dim);
    font-size:11px;
    letter-spacing:1px;
    border:1px dashed var(--lime-dim);
    padding:4px 12px;
    border-radius:20px;
    background:rgba(57,255,20,0.03);
  }

  .msg{
    max-width:78%;
    background:var(--panel-2);
    border:1px solid #1c231c;
    border-left:3px solid var(--lime-dim);
    border-radius:4px;
    padding:8px 12px;
    animation:msgIn 0.25s ease;
  }

  @keyframes msgIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .msg.mine{
    align-self:flex-end;
    border-left:3px solid var(--crimson);
    background:#12100f;
  }

  .msg-meta{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:11px;
    margin-bottom:3px;
    letter-spacing:0.5px;
  }

  .msg-user{ font-weight:700; }
  .msg-time{ color:#5a6a5a; }
  .msg-text{ font-size:14px; word-break:break-word; line-height:1.4; color:#dfffe0; }

  .msg-img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 4px;
    margin-top: 6px;
    border: 1px solid var(--lime-dim);
    display: block;
  }

  #typingIndicator{
    min-height:20px;
    padding:0 16px 4px;
    color:var(--lime-dim);
    font-size:10px;
    letter-spacing:1px;
    text-align:left;
    text-shadow:0 0 7px rgba(57,255,20,0.35);
    pointer-events:none;
  }
  #typingIndicator:empty{ min-height:0; padding:0; }

  .typing-user{ color:var(--lime-glow); font-weight:700; }
  .typing-dots{
    display:inline-block;
    width:18px;
    overflow:hidden;
    vertical-align:bottom;
    animation:typingDots 1.2s steps(4,end) infinite;
  }

  @keyframes typingDots{
    0%{ width:0; }
    100%{ width:18px; }
  }

  form#composer{
    display:flex;
    gap:10px;
    padding:14px;
    background:#080a08;
    border-top:1px solid var(--lime-dim);
  }

  #msgInput{
    flex:1;
    background:#0b0e0b;
    border:1px solid var(--lime-dim);
    border-radius:5px;
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    padding:12px 14px;
    outline:none;
    transition:box-shadow 0.15s, border-color 0.15s;
  }

  #msgInput:focus{
    border-color:var(--lime-glow);
    box-shadow:0 0 14px rgba(0,255,102,0.35);
  }

  #fileUploadBtn {
    background: var(--panel-2);
    border: 1px solid var(--lime-dim);
    color: var(--lime-glow);
    font-family: var(--mono);
    font-weight: 800;
    padding: 0 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  #fileUploadBtn:hover {
    box-shadow: 0 0 12px rgba(57,255,20,0.4);
    border-color: var(--lime-glow);
  }

  #sendBtn{
    background:var(--lime);
    border:none;
    color:#031403;
    font-family:var(--mono);
    font-weight:800;
    padding:0 20px;
    border-radius:5px;
    cursor:pointer;
    letter-spacing:1px;
    transition:transform 0.1s, box-shadow 0.15s;
  }

  #sendBtn:hover{
    box-shadow:0 0 16px rgba(57,255,20,0.6);
    transform:translateY(-1px);
  }

  .footnote{
    text-align:center;
    font-size:10px;
    color:#33452f;
    padding:4px 0 8px;
    letter-spacing:1px;
  }

  #usersModal {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .users-modal-box {
    width: min(90vw, 380px);
    background: linear-gradient(180deg, var(--panel), #08090a);
    border: 1px solid var(--lime-dim);
    border-radius: 6px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(57,255,20,0.2);
  }
  .users-modal-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--lime-glow);
    margin-bottom: 12px;
    letter-spacing: 2px;
    border-bottom: 1px dashed var(--lime-dim);
    padding-bottom: 6px;
  }
  #onlineUsersList {
    max-height: 200px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .online-user-item {
    background: var(--panel-2);
    padding: 6px 10px;
    border-radius: 4px;
    border-left: 2px solid var(--lime-dim);
  }
  .close-modal-btn {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--lime-dim);
    color: var(--text);
    font-family: var(--mono);
    padding: 8px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .close-modal-btn:hover {
    border-color: var(--lime-glow);
    color: var(--lime-glow);
  }
</style>
</head>

<body>

<canvas id="matrixCanvas"></canvas>
<div class="crt-overlay"></div>
<div class="crt-vignette"></div>

<div id="usersModal">
  <div class="users-modal-box">
    <div class="users-modal-title">// ACTIVE NODES IN NETWORK</div>

</div>

<div id="lockScreen" class="flicker">
  <div class="lock-box">

<div id="app">

  <main id="feed"></main>

  <div id="typingIndicator"></div>

  <form id="composer" autocomplete="off">
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button type="button" id="fileUploadBtn" title="Attach Image">📁</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, setDoc, onSnapshot, query, orderBy, getDocs, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const typingCol = collection(db, "typing");
const purgeRef = doc(db, "meta", "purge");

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playKeyClickSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(120 + Math.random() * 40, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.04);
}
function playNotificationSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
let cols, drops;
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cols = Math.floor(canvas.width / 16);
  drops = new Array(cols).fill(0).map(() => Math.random() * -100);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
const chars = "01LIMEDEVIL01ΞΔ01";
function drawMatrix(){
  ctx.fillStyle = "rgba(5,5,5,0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#39FF14";
  ctx.font = "14px monospace";
  for(let i = 0; i < cols; i++){
    ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, drops[i] * 16);
    if(drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
  requestAnimationFrame(drawMatrix);
}
drawMatrix();

const PASSWORD = "1280";
const PURGE_MS = 10 * 60 * 1000;
const EMERGENCY_PASSWORD = "101";

const PREFIXES = ["Devil", "Lime", "Void", "Ghost", "Shadow", "Cipher", "Wraith", "Static"];
function generateCodename(){
  return `${PREFIXES[Math.floor(Math.random() * PREFIXES.length)]}_${Math.floor(1000 + Math.random() * 8999)}`;
}
const myName = generateCodename();
const myColor = ["#39FF14", "#ff1744", "#00eaff", "#ffd600", "#ff6e40", "#b388ff"][Math.floor(Math.random() * 6)];
const myId = myName + "_" + Math.random().toString(36).slice(2,8);
document.getElementById('myNameChip').textContent = "YOU: " + myName;

const feed = document.getElementById('feed');
function fmtTime(ts){ return new Date(ts).toTimeString().slice(0,8); }
function escapeHTML(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function renderMessageDoc(m){
  if(m.type === 'system'){
    const el = document.createElement('div');
    el.className = 'sys-msg';
    el.textContent = m.text;
    feed.appendChild(el);
    return;
  }
  const el = document.createElement('div');
  el.className = 'msg' + (m.userId === myId ? ' mine' : '');
  let contentHtml = `<div class="msg-text"></div>`;
  if(m.fileUrl){
    contentHtml += `<img src="${escapeHTML(m.fileUrl)}" class="msg-img" alt="attachment">`;
  }
  el.innerHTML = `
    <div class="msg-meta"><span class="msg-user" style="color:${m.color}">${escapeHTML(m.user)}</span><span class="msg-time">${fmtTime(m.ts)}</span></div>
    ${contentHtml}
  `;
  el.querySelector('.msg-text').textContent = m.text;
  feed.appendChild(el);
}
function scrollToBottom(){ feed.scrollTop = feed.scrollHeight; }

async function pushSystemMessage(text){
  try { await addDoc(messagesCol, { type:'system', text, ts:Date.now() }); } catch(e){}
}
async function sendMessage(text, fileUrl = null){
  text = text.trim();
  if(!text && !fileUrl) return;
  try { await addDoc(messagesCol, { type:'msg', user:myName, userId:myId, color:myColor, text, fileUrl, ts:Date.now() }); } catch(e){}
}

document.getElementById("emergencyBtn").addEventListener("click", async () => {
  const pwd = prompt("EMERGENCY WIPE — ENTER PASSWORD:");
  if(pwd !== EMERGENCY_PASSWORD) { if(pwd !== null) alert("ACCESS DENIED"); return; }
  if(!confirm("⚠ WIPE ALL MESSAGES?")) return;
  try {
    const snap = await getDocs(messagesCol);
    const batch = writeBatch(db);
    snap.forEach(d => batch.delete(d.ref));
    await batch.commit();
  } catch(e){ alert("WIPE FAILED"); }
});

const purgeTimerEl = document.getElementById('purgeTimer');
let purgeStart = Date.now();
let purging = false;

async function tryPurge(){
  if(purging) return;
  purging = true;
  try {
    const didPurge = await runTransaction(db, async (tx) => {
      const snap = await tx.get(purgeRef);
      const start = (snap.exists() && typeof snap.data().purgeStart === 'number') ? snap.data().purgeStart : 0;
      if(Date.now() - start >= PURGE_MS){
        tx.set(purgeRef, { purgeStart: Date.now() });
        return true;
      }
      return false;
    });
    if(didPurge){
      const msgsSnap = await getDocs(messagesCol);
      const batch = writeBatch(db);
      msgsSnap.forEach(d => batch.delete(d.ref));
      await batch.commit();
      await pushSystemMessage("[ SYSTEM PURGE COMPLETE — ALL LOGS WIPED ]");
    }
  } catch(e){} finally { purging = false; }
}

function tickPurge(){
  const remaining = PURGE_MS - (Date.now() - purgeStart);
  if(remaining <= 0){
    purgeTimerEl.textContent = "00:00";
    tryPurge();
    return;
  }
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  purgeTimerEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

const typingIndicator = document.getElementById('typingIndicator');
let typingTimeout = null;
let currentlyTyping = false;

async function setTypingState(isTyping){
  try { await setDoc(doc(typingCol, myId), { user:myName, userId:myId, color:myColor, isTyping, lastSeen:Date.now() }); } catch(e){}
}
function startTyping(){
  if(!currentlyTyping){ currentlyTyping = true; setTypingState(true); }
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => stopTyping(), 1500);
}
function stopTyping(){
  if(!currentlyTyping) return;
  currentlyTyping = false;
  clearTimeout(typingTimeout);
  setTypingState(false);
}
function renderTyping(snapshot){
  const now = Date.now();
  const typers = [];
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    if(!data || data.userId === myId || data.isTyping !== true || (now - data.lastSeen > 3000)) return;
    typers.push(data);
  });
  if(!typers.length){ typingIndicator.textContent = ""; return; }
  if(typers.length === 1){
    typingIndicator.innerHTML = `<span class="typing-user">${escapeHTML(typers[0].user)}</span> IS TYPING<span class="typing-dots">...</span>`;
    return;
  }
  const names = typers.slice(0,3).map(u => `<span class="typing-user">${escapeHTML(u.user)}</span>`).join(", ");
  typingIndicator.innerHTML = `${names} ARE TYPING<span class="typing-dots">...</span>`;
}

let chatInitialized = false;
let lastMessageCount = 0;

function initChat(){
  if(chatInitialized) return;
  chatInitialized = true;

  if("Notification" in window && Notification.permission !== "granted"){
    Notification.requestPermission();
  }

  onSnapshot(query(messagesCol, orderBy("ts")), (snapshot) => {
    if(lastMessageCount > 0 && snapshot.docs.length > lastMessageCount){
      const newestDoc = snapshot.docs[snapshot.docs.length - 1].data();
      if(newestDoc && newestDoc.type !== 'system' && newestDoc.userId !== myId){
        playNotificationSound();
        if("vibrate" in navigator) navigator.vibrate([100, 50, 100]);
        if(document.hidden && "Notification" in window && Notification.permission === "granted"){
          new Notification(`LIME DEVIL // ${newestDoc.user}`, { body: newestDoc.text || "New message received." });
        }
      }
    }
    lastMessageCount = snapshot.docs.length;

    feed.innerHTML = '';
    snapshot.forEach(docSnap => renderMessageDoc(docSnap.data()));
    scrollToBottom();
  });

  onSnapshot(presenceCol, (snapshot) => {
    let active = 0, html = '';
    const now = Date.now();
    snapshot.forEach(d => {
      const data = d.data();
      if(data && (now - data.lastSeen) < 20000){
        active++;
        html += `<div class="online-user-item" style="color:${data.color}">◈ ${escapeHTML(data.user)}</div>`;
      }
    });
    document.getElementById('userCount').textContent = Math.max(1, active);
    document.getElementById('onlineUsersList').innerHTML = html || '<div class="online-user-item">No other nodes active.</div>';
  });

  onSnapshot(typingCol, renderTyping);

  onSnapshot(purgeRef, (snap) => {
    if(snap.exists() && typeof snap.data().purgeStart === 'number'){
      purgeStart = snap.data().purgeStart;
    } else {
      setDoc(purgeRef, { purgeStart: Date.now() }).catch(()=>{});
    }
  });

  setInterval(tickPurge, 1000);
  tickPurge();
  setInterval(() => setDoc(doc(presenceCol, myId), { user: myName, color: myColor, lastSeen: Date.now() }), 5000);
  pushSystemMessage(`[ ${myName} HAS JOINED THE NODE ]`);
}

const lockScreen = document.getElementById('lockScreen');
const passInput = document.getElementById('passInput');
const lockError = document.getElementById('lockError');
const lockBox = document.querySelector('.lock-box');

async function attemptUnlock(){
  if(passInput.value.trim() !== PASSWORD){
    lockError.textContent = "ACCESS DENIED — INVALID CLEARANCE CODE";
    lockBox.classList.add('shake');
    setTimeout(() => lockBox.classList.remove('shake'), 350);
    passInput.value = '';
    return;
  }
  try { await signInAnonymously(auth); } catch(e){}
  lockScreen.classList.add('lock-dissolve');
  setTimeout(() => {
    lockScreen.style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initChat();
    document.getElementById('msgInput').focus();
  }, 680);
}

document.getElementById('unlockBtn').addEventListener('click', attemptUnlock);
passInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') attemptUnlock(); });

document.getElementById('openUsersModalBtn').addEventListener('click', () => document.getElementById('usersModal').style.display = 'flex');
document.getElementById('closeUsersModal').addEventListener('click', () => document.getElementById('usersModal').style.display = 'none');

const msgInput = document.getElementById('msgInput');
const fileInput = document.getElementById('fileInput');
const fileUploadBtn = document.getElementById('fileUploadBtn');

msgInput.addEventListener('input', () => {
  playKeyClickSound();
  if(msgInput.value.trim()) startTyping(); else stopTyping();
});

fileUploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if(!file) return;
  try {
    fileUploadBtn.textContent = "⌛";
    const fileRef = sRef(storage, `uploads/${Date.now()}_${file.name}`);
    await uploadBytes(fileRef, file);
    const downloadUrl = await getDownloadURL(fileRef);
    await sendMessage(file.name, downloadUrl);
    fileInput.value = '';
  } catch(e) {
    alert("FILE UPLOAD FAILED");
  } finally {
    fileUploadBtn.textContent = "📁";
  }
});

document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  sendMessage(msgInput.value);
  msgInput.value = '';
  stopTyping();
  msgInput.focus();
});
</script>
