<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>LIME DEVIL // encrypted terminal</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700;800&display=swap');

    :root{
      --void:#050505;
      --panel:#0c0f0c;
      --panel-2:#111511;
      --lime:#39FF14;
      --lime-dim:#1c8a0c;
      --lime-glow:#00FF66;
      --crimson:#ff1744;
      --crimson-dim:#7a0a1d;
      --text:#c9ffcf;
      --mono:'JetBrains Mono','Share Tech Mono','Courier New',monospace;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      width:100%;
      height:100%;
      min-height:100%;
      background:var(--void);
      color:var(--text);
      font-family:var(--mono);
      overflow:hidden;
    }

    body{
      overscroll-behavior:none;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    button,
    input{
      font:inherit;
    }

    button{
      -webkit-appearance:none;
      appearance:none;
      touch-action:manipulation;
    }

    input{
      -webkit-appearance:none;
      appearance:none;
    }

    /* ---------- background ---------- */

    #matrixCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      opacity:0.10;
      pointer-events:none;
    }

    /* ---------- CRT ---------- */

    .crt-overlay{
      position:fixed;
      inset:0;
      z-index:9998;
      pointer-events:none;
      background:repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 1px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 3px
      );
      mix-blend-mode:overlay;
    }

    .crt-vignette{
      position:fixed;
      inset:0;
      z-index:9997;
      pointer-events:none;
      background:radial-gradient(
        ellipse at center,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.65) 100%
      );
    }

    .flicker{
      animation:flicker 6s infinite;
    }

    @keyframes flicker{
      0%,19%,21%,23%,25%,54%,56%,100%{
        opacity:1;
      }

      20%,22%,24%,55%{
        opacity:0.86;
      }
    }

    /* ---------- glitch ---------- */

    .glitch{
      position:relative;
      color:var(--lime-glow);
      text-shadow:
        0 0 6px var(--lime-glow),
        0 0 18px rgba(0,255,102,0.5);
      letter-spacing:2px;
    }

    .glitch::before,
    .glitch::after{
      content:attr(data-text);
      position:absolute;
      left:0;
      top:0;
      width:100%;
      overflow:hidden;
      background:transparent;
      pointer-events:none;
    }

    .glitch::before{
      color:var(--crimson);
      left:2px;
      animation:glitchTop 3.2s infinite linear alternate-reverse;
      clip-path:inset(0 0 60% 0);
    }

    .glitch::after{
      color:#00eaff;
      left:-2px;
      animation:glitchBottom 2.6s infinite linear alternate-reverse;
      clip-path:inset(60% 0 0 0);
    }

    @keyframes glitchTop{
      0%{transform:translate(0,0);}
      20%{transform:translate(-2px,-1px);}
      40%{transform:translate(2px,1px);}
      60%{transform:translate(-1px,1px);}
      80%{transform:translate(1px,-1px);}
      100%{transform:translate(0,0);}
    }

    @keyframes glitchBottom{
      0%{transform:translate(0,0);}
      25%{transform:translate(2px,1px);}
      50%{transform:translate(-2px,-1px);}
      75%{transform:translate(1px,1px);}
      100%{transform:translate(0,0);}
    }

    /* ================= LOCK SCREEN ================= */

    #lockScreen{
      position:fixed;
      inset:0;
      z-index:20;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      background:
        radial-gradient(
          ellipse at 50% 20%,
          rgba(57,255,20,0.06),
          transparent 60%
        ),
        var(--void);
    }

    .lock-box{
      width:min(92vw,460px);

      background:linear-gradient(
        180deg,
        var(--panel),
        #08090a
      );

      border:1px solid var(--lime-dim);
      border-radius:6px;

      padding:34px 30px 30px;

      box-shadow:
        0 0 40px rgba(57,255,20,0.12),
        inset 0 0 30px rgba(0,0,0,0.6);

      position:relative;
    }

    .lock-box::before{
      content:'';
      position:absolute;
      inset:-1px;
      border-radius:6px;
      padding:1px;

      background:
        linear-gradient(
          135deg,
          var(--lime),
          transparent 40%,
          var(--crimson-dim)
        );

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

      -webkit-mask-composite:xor;
      mask-composite:exclude;

      opacity:0.5;
      pointer-events:none;
    }

    .lock-title{
      font-size:clamp(28px,6vw,40px);
      font-weight:800;
      text-align:center;
      margin-bottom:6px;
    }

    .lock-sub{
      text-align:center;
      color:var(--lime-dim);
      font-size:12px;
      letter-spacing:3px;
      margin-bottom:22px;
      text-transform:uppercase;
    }

    .hint-line{
      background:rgba(255,23,68,0.06);
      border:1px dashed var(--crimson-dim);
      color:var(--crimson);
      font-size:12px;
      padding:8px 10px;
      border-radius:4px;
      margin-bottom:20px;
      text-align:center;
      letter-spacing:1px;
      animation:pulseHint 2.4s infinite;
    }

    @keyframes pulseHint{
      0%,100%{
        box-shadow:0 0 0 rgba(255,23,68,0);
      }

      50%{
        box-shadow:0 0 14px rgba(255,23,68,0.35);
      }
    }

    .pass-row{
      display:flex;
      gap:8px;
    }

    #passInput{
      flex:1;
      min-width:0;

      background:#050805;
      border:1px solid var(--lime-dim);
      border-radius:4px;

      color:var(--lime-glow);
      font-family:var(--mono);
      font-size:18px;

      letter-spacing:6px;
      text-align:center;

      padding:14px 10px;

      outline:none;

      transition:
        box-shadow 0.15s,
        border-color 0.15s;
    }

    #passInput:focus{
      border-color:var(--lime-glow);
      box-shadow:0 0 16px rgba(0,255,102,0.5);
    }

    #unlockBtn{
      background:var(--lime);
      border:none;
      color:#031403;

      font-family:var(--mono);
      font-weight:800;

      padding:0 18px;
      border-radius:4px;

      cursor:pointer;
      letter-spacing:1px;

      transition:
        transform 0.1s,
        box-shadow 0.15s;
    }

    #unlockBtn:disabled{
      opacity:0.55;
      cursor:not-allowed;
    }

    #unlockBtn:hover{
      box-shadow:0 0 18px rgba(57,255,20,0.6);
      transform:translateY(-1px);
    }

    .lock-error{
      margin-top:12px;
      text-align:center;
      color:var(--crimson);
      font-size:12px;
      min-height:16px;
      letter-spacing:1px;
    }

    .shake{
      animation:shake 0.35s;
    }

    @keyframes shake{
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-8px);}
      40%{transform:translateX(8px);}
      60%{transform:translateX(-5px);}
      80%{transform:translateX(5px);}
    }

    .lock-dissolve{
      animation:dissolveOut 0.7s forwards;
    }

    @keyframes dissolveOut{
      0%{
        opacity:1;
        filter:blur(0) brightness(1);
      }

      40%{
        opacity:0.7;
        filter:blur(2px) brightness(3) hue-rotate(30deg);
      }

      100%{
        opacity:0;
        filter:blur(10px) brightness(0.2);
        transform:scale(1.04);
      }
    }

    /* ================= APP ================= */

    #app{
      position:relative;
      z-index:1;

      display:none;
      flex-direction:column;

      width:100%;
      height:100vh;
      height:100dvh;

      min-height:0;

      animation:fadeIn 0.6s ease;
    }

    @keyframes fadeIn{
      from{opacity:0;}
      to{opacity:1;}
    }

    header{
      flex:0 0 auto;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      padding:
        calc(12px + env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        12px
        max(18px, env(safe-area-inset-left));

      background:linear-gradient(
        180deg,
        #0a0c0a,
        #060706
      );

      border-bottom:1px solid var(--lime-dim);

      flex-wrap:wrap;
    }

    .logo{
      font-size:22px;
      font-weight:800;
      letter-spacing:2px;
    }

    .header-stats{
      display:flex;
      align-items:center;
      gap:16px;
      font-size:12px;
    }

    .stat-chip{
      background:var(--panel-2);
      border:1px solid var(--lime-dim);
      border-radius:20px;

      padding:6px 12px;

      display:flex;
      align-items:center;
      gap:6px;

      letter-spacing:1px;
      white-space:nowrap;
    }

    .dot{
      width:7px;
      height:7px;
      flex:0 0 7px;

      border-radius:50%;

      background:var(--lime-glow);
      box-shadow:0 0 8px var(--lime-glow);

      animation:blink 1.6s infinite;
    }

    @keyframes blink{
      50%{opacity:0.25;}
    }

    #purgeTimer{
      color:var(--crimson);

      text-shadow:
        0 0 8px rgba(255,23,68,0.7);

      font-weight:700;
    }

    /* ================= FEED ================= */

    main{
      flex:1 1 auto;

      min-height:0;

      overflow-y:auto;
      overflow-x:hidden;

      padding:18px 14px 10px;

      display:flex;
      flex-direction:column;
      gap:10px;

      scroll-behavior:smooth;

      -webkit-overflow-scrolling:touch;

      overscroll-behavior:contain;
    }

    main::-webkit-scrollbar{
      width:8px;
    }

    main::-webkit-scrollbar-thumb{
      background:var(--lime-dim);
      border-radius:4px;
    }

    main::-webkit-scrollbar-track{
      background:transparent;
    }

    .sys-msg{
      align-self:center;

      color:var(--lime-dim);
      font-size:11px;

      letter-spacing:1px;

      border:1px dashed var(--lime-dim);

      padding:4px 12px;

      border-radius:20px;

      background:rgba(57,255,20,0.03);

      direction:auto;
      unicode-bidi:plaintext;
      text-align:center;
    }

    .msg{
      max-width:78%;

      background:var(--panel-2);

      border:1px solid #1c231c;
      border-left:3px solid var(--lime-dim);

      border-radius:4px;

      padding:8px 12px;

      animation:msgIn 0.25s ease;

      direction:auto;
      unicode-bidi:plaintext;
    }

    @keyframes msgIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .msg.mine{
      align-self:flex-end;

      border-left:3px solid var(--crimson);

      background:#12100f;
    }

    .msg-meta{
      display:flex;
      justify-content:space-between;
      gap:12px;

      font-size:11px;
      margin-bottom:3px;

      letter-spacing:0.5px;
    }

    .msg-user{
      font-weight:700;
      unicode-bidi:plaintext;
    }

    .msg-time{
      color:#5a6a5a;
      direction:ltr;
      unicode-bidi:isolate;
      flex-shrink:0;
    }

    .msg-text{
      font-size:14px;

      line-height:1.5;

      color:#dfffe0;

      white-space:pre-wrap;

      overflow-wrap:anywhere;
      word-break:normal;

      direction:auto;
      unicode-bidi:plaintext;

      text-align:start;

      -webkit-user-select:text;
      user-select:text;
    }

    /* ================= COMPOSER ================= */

    form#composer{
      flex:0 0 auto;

      display:flex;
      align-items:stretch;

      gap:10px;

      padding:
        14px
        max(14px, env(safe-area-inset-right))
        calc(14px + env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));

      background:#080a08;

      border-top:1px solid var(--lime-dim);

      position:relative;
      z-index:5;
    }

    #msgInput{
      flex:1;
      min-width:0;

      background:#0b0e0b;

      border:1px solid var(--lime-dim);
      border-radius:5px;

      color:var(--text);

      font-family:var(--mono);

      font-size:16px;

      line-height:1.4;

      padding:12px 14px;

      outline:none;

      direction:auto;
      unicode-bidi:plaintext;

      text-align:start;

      transition:
        box-shadow 0.15s,
        border-color 0.15s;

      -webkit-user-select:text;
      user-select:text;

      /* Important for Android keyboards */
      ime-mode:auto;
    }

    #msgInput:focus{
      border-color:var(--lime-glow);

      box-shadow:
        0 0 14px rgba(0,255,102,0.35);
    }

    #msgInput::placeholder{
      color:#3d4d3d;
      opacity:1;
    }

    #sendBtn{
      flex:0 0 auto;

      min-width:88px;

      background:var(--lime);

      border:none;

      color:#031403;

      font-family:var(--mono);

      font-weight:800;

      padding:0 20px;

      border-radius:5px;

      cursor:pointer;

      letter-spacing:1px;

      transition:
        transform 0.1s,
        box-shadow 0.15s,
        opacity 0.15s;
    }

    #sendBtn:hover{
      box-shadow:0 0 16px rgba(57,255,20,0.6);
      transform:translateY(-1px);
    }

    #sendBtn:active{
      transform:translateY(0);
    }

    #sendBtn:disabled{
      opacity:0.45;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .footnote{
      flex:0 0 auto;

      text-align:center;

      font-size:10px;

      color:#33452f;

      padding:4px 0 8px;

      letter-spacing:1px;

      background:#080a08;

      padding-bottom:
        max(8px, env(safe-area-inset-bottom));
    }

    /* ================= MOBILE ================= */

    @media (max-width:640px){

      .logo{
        font-size:18px;
      }

      .header-stats{
        width:100%;
        font-size:9px;
        gap:6px;
        overflow-x:auto;
        scrollbar-width:none;
      }

      .header-stats::-webkit-scrollbar{
        display:none;
      }

      .stat-chip{
        padding:5px 8px;
      }

      .msg{
        max-width:92%;
      }

      .lock-box{
        padding:26px 18px 22px;
      }

      form#composer{
        gap:8px;
        padding-top:10px;
      }

      #msgInput{
        font-size:16px;
        padding:12px;
      }

      #sendBtn{
        min-width:72px;
        padding:0 12px;
      }

      .footnote{
        font-size:8px;
        padding-left:8px;
        padding-right:8px;
      }
    }

    @media (max-width:380px){

      .header-stats{
        font-size:8px;
      }

      #sendBtn{
        min-width:64px;
        padding:0 8px;
      }
    }
  </style>
</head>

<body>

  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>

  <!-- ================= LOCK SCREEN ================= -->

    /* =========================================================
       MATRIX BACKGROUND
    ========================================================= */

    const canvas =
      document.getElementById("matrixCanvas");

    const ctx =
      canvas.getContext("2d");

    let cols = 0;
    let drops = [];


    function resizeCanvas(){

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

      cols =
        Math.floor(canvas.width / 16);

      drops =
        new Array(cols)
          .fill(0)
          .map(() => Math.random() * -100);
    }


    window.addEventListener(
      "resize",
      resizeCanvas,
      { passive:true }
    );


    resizeCanvas();


    const chars =
      "01LIMEDEVIL01ΞΔ01";


    function drawMatrix(){

      ctx.fillStyle =
        "rgba(5,5,5,0.08)";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.fillStyle =
        "#39FF14";

      ctx.font =
        "14px monospace";


      for(let i = 0; i < cols; i++){

        const text =
          chars[
            Math.floor(
              Math.random() * chars.length
            )
          ];


        ctx.fillText(
          text,
          i * 16,
          drops[i] * 16
        );


        if(
          drops[i] * 16 >
          canvas.height &&
          Math.random() > 0.975
        ){

          drops[i] = 0;

        }


        drops[i]++;
      }


      requestAnimationFrame(drawMatrix);
    }


    drawMatrix();

       CONSTANTS

    /* =========================================================

      "Vex",
      "Storm"
    ];


    function generateCodename(){

      const usePrefixOnly =
        Math.random() > 0.5;


      const p =
        PREFIXES[
          Math.floor(
            Math.random() * PREFIXES.length
          )
        ];


      const num =
        Math.floor(
          1000 +
          Math.random() * 8999
        );


      if(usePrefixOnly){

        return `${p}_${num}`;

      }


      const s =
        SUFFIXES[
          Math.floor(
            Math.random() * SUFFIXES.length
          )
        ];


      return `${p}_${s}_${num % 100}`;
    }


    const myName =
      generateCodename();


    const myColor =
      NAME_COLORS[
        Math.floor(
          Math.random() *
          NAME_COLORS.length
        )
      ];


    const myId =
      myName +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8);


    document.getElementById(
      "myNameChip"
    ).textContent =
      "YOU: " + myName;


    /* =========================================================
       DOM
    ========================================================= */

    const feed =
      document.getElementById("feed");

    const userCountEl =
      document.getElementById("userCount");

    const purgeTimerEl =
      document.getElementById("purgeTimer");

    const composer =
      document.getElementById("composer");

    const msgInput =
      document.getElementById("msgInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const lockScreen =
      document.getElementById("lockScreen");

    const passInput =
      document.getElementById("passInput");

    const unlockBtn =
      document.getElementById("unlockBtn");

    const lockError =
      document.getElementById("lockError");

    const lockBox =
      document.querySelector(".lock-box");

    const appEl =
      document.getElementById("app");


    /* =========================================================
       TEXT HELPERS
    ========================================================= */

    function normalizeMessage(value){

      if(typeof value !== "string"){
        return "";
      }

      /*
        NFC normalization prevents some Unicode
        inconsistencies, especially with Arabic text.
      */

      return value
        .normalize("NFC")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");
    }


    function fmtTime(ts){

      const d =
        new Date(ts);


      return d
        .toTimeString()
        .slice(0,8);
    }


    /* =========================================================
       RENDER MESSAGE
    ========================================================= */

    function renderMessageDoc(m){

      if(!m){
        return;
      }


      if(m.type === "system"){

        const el =
          document.createElement("div");

        el.className =
          "sys-msg";

        el.dir =
          "auto";

        el.textContent =
          typeof m.text === "string"
            ? m.text
            : "";

        feed.appendChild(el);

        return;
      }


      const el =
        document.createElement("div");


      el.className =
        "msg" +
        (m.userId === myId
          ? " mine"
          : "");


      el.dir = "auto";


      const meta =
        document.createElement("div");

      meta.className =
        "msg-meta";


      const user =
        document.createElement("span");

      user.className =
        "msg-user";

      user.dir =
        "auto";

      user.style.color =
        m.color || "#39FF14";

      user.textContent =
        m.user || "UNKNOWN";


      const time =
        document.createElement("span");

      time.className =
        "msg-time";

      time.textContent =
        fmtTime(m.ts);


      meta.appendChild(user);
      meta.appendChild(time);


      const text =
        document.createElement("div");

      text.className =
        "msg-text";

      text.dir =
        "auto";

      /*
        textContent is intentional.
        This prevents HTML injection and preserves
        the exact Unicode text.
      */

      text.textContent =
        normalizeMessage(
          typeof m.text === "string"
            ? m.text
            : ""
        );


      el.appendChild(meta);
      el.appendChild(text);


      feed.appendChild(el);
    }


    function scrollToBottom(){

      requestAnimationFrame(() => {

        feed.scrollTop =
          feed.scrollHeight;

      });
    }


    /* =========================================================
       FIRESTORE MESSAGES
    ========================================================= */

    const messagesQuery =
      query(
        messagesCol,
        orderBy("ts")
      );


    async function pushSystemMessage(text){

      try{

        const now =
          Date.now();


        await addDoc(
          messagesCol,
          {
            type:"system",

            text:normalizeMessage(text),

            ts:now,

            expiresAt:
              new Date(
                now + PURGE_MS
              )
          }
        );

      }catch(e){

        console.error(
          "system message error:",
          e
        );

      }
    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    let sendingMessage = false;


    async function sendMessage(rawText){

      /*
        Important:
        Do not read/clear the input during Android
        composition events.
      */

      const text =
        normalizeMessage(rawText)
          .trim();


      if(!text){
        return false;
      }


      if(sendingMessage){
        return false;
      }


      sendingMessage = true;

      sendBtn.disabled = true;


      try{

        const now =
          Date.now();


        await addDoc(
          messagesCol,
          {
            type:"msg",

            user:myName,

            userId:myId,

            color:myColor,

            /*
              Store the normalized original text.
            */
            text:text,

            ts:now,

            expiresAt:
              new Date(
                now + PURGE_MS
              )
          }
        );


        return true;

      }catch(e){

        console.error(
          "send message error:",
          e
        );

        return false;

      }finally{

        sendingMessage = false;

        sendBtn.disabled = false;

      }
    }


    /* =========================================================
       ANDROID / MOBILE INPUT HANDLING
    ========================================================= */

    let isComposing = false;


    msgInput.addEventListener(
      "compositionstart",
      () => {

        isComposing = true;

      }
    );


    msgInput.addEventListener(
      "compositionend",
      () => {

        /*
          Android may fire compositionend immediately
          before input/keydown finishes.
        */

        setTimeout(() => {

          isComposing = false;

        }, 0);

      }
    );


    /*
      Important:
      Never manually send on keydown while Android IME
      is composing text.
    */

    msgInput.addEventListener(
      "keydown",
      (e) => {

        if(e.key !== "Enter"){
          return;
        }


        if(
          isComposing ||
          e.isComposing ||
          e.keyCode === 229
        ){

          return;

        }


        /*
          On mobile, allow the form's submit event
          to handle the actual sending.
        */

        e.preventDefault();


        if(
          !sendingMessage &&
          msgInput.value.trim()
        ){

          composer.requestSubmit();

        }

      }
    );


    /*
      Some Android keyboards trigger beforeinput
      with composition information.
    */

    msgInput.addEventListener(
      "beforeinput",
      (e) => {

        if(
          e.inputType ===
          "insertCompositionText"
        ){

          isComposing = true;

        }

      }
    );


    /*
      Keep the field direction automatic.
      This helps Arabic/English mixed messages.
    */

    msgInput.addEventListener(
      "input",
      () => {

        msgInput.dir = "auto";

      }
    );


    /* =========================================================
       COMPOSER SUBMIT
    ========================================================= */

    composer.addEventListener(
      "submit",
      async (e) => {

        e.preventDefault();


        /*
          Android IME can sometimes submit before
          composition is completely finished.
        */

        if(isComposing){

          return;

        }


        if(sendingMessage){
          return;
        }


        const text =
          msgInput.value;


        if(!text.trim()){
          return;
        }


        /*
          Do NOT clear before Firebase succeeds.
          This prevents text loss on mobile/network issues.
        */

        const success =
          await sendMessage(text);


        if(success){

          /*
            Only clear exactly after successful upload.
          */

          msgInput.value = "";

          msgInput.dir = "auto";


          /*
            Restore focus without forcing the keyboard
            open repeatedly.
          */

          requestAnimationFrame(() => {

            try{
              msgInput.focus({
                preventScroll:true
              });
            }catch{
              msgInput.focus();
            }

          });

        }

      }
    );


    /* =========================================================
       PRESENCE
    ========================================================= */

    async function heartbeat(){

      try{

        await setDoc(
          doc(
            presenceCol,
            myId
          ),
          {
            lastSeen:Date.now()
          }
        );

      }catch(e){

        console.error(
          "heartbeat error:",
          e
        );

      }
    }


    /* =========================================================
       PURGE
    ========================================================= */

    let purgeStart = null;

    let purging = false;


    async function deleteAllMessagesInBatches(){

      const msgsSnap =
        await getDocs(
          messagesCol
        );


      if(msgsSnap.empty){
        return 0;
      }


      const docs =
        msgsSnap.docs;


      let deleted = 0;


      for(
        let i = 0;
        i < docs.length;
        i += 450
      ){

        const batch =
          writeBatch(db);


        docs
          .slice(i, i + 450)
          .forEach(d => {

            batch.delete(
              d.ref
            );

          });


        await batch.commit();


        deleted +=
          Math.min(
            450,
            docs.length - i
          );
      }


      return deleted;
    }


    async function tryPurge(){

      if(
        purging ||
        typeof purgeStart !== "number"
      ){

        return;

      }


      purging = true;


      try{

        const now =
          Date.now();


        const didPurge =
          await runTransaction(
            db,
            async(tx) => {

              const snap =
                await tx.get(
                  purgeRef
                );


              const start =
                (
                  snap.exists() &&
                  typeof snap.data().purgeStart === "number"
                )
                  ? snap.data().purgeStart
                  : now;


              if(
                now - start >= PURGE_MS
              ){

                tx.set(
                  purgeRef,
                  {
                    purgeStart:now
                  }
                );

                return true;
              }


              return false;

            }
          );


        if(didPurge){

          await deleteAllMessagesInBatches();


          await pushSystemMessage(
            "[ SYSTEM PURGE COMPLETE — ALL TRAFFIC LOGS WIPED ]"
          );

        }

      }catch(e){

        console.error(
          "purge error:",
          e
        );

      }finally{

        purging = false;

      }
    }


    function tickPurge(){

      if(
        typeof purgeStart !== "number"
      ){

        purgeTimerEl.textContent =
          "10:00";

        return;
      }


      const remaining =
        PURGE_MS -
        (
          Date.now() -
          purgeStart
        );


      if(remaining <= 0){

        purgeTimerEl.textContent =
          "00:00";

        tryPurge();

        return;
      }


      const mins =
        Math.floor(
          remaining / 60000
        );


      const secs =
        Math.floor(
          (remaining % 60000) /
          1000
        );


      purgeTimerEl.textContent =
        `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
    }


    /* =========================================================
       CHAT INITIALIZATION
    ========================================================= */

    let chatInitialized = false;


    function initChat(){

      if(chatInitialized){
        return;
      }


      chatInitialized = true;


      /* ---------- messages ---------- */

      onSnapshot(
        messagesQuery,

        (snapshot) => {

          feed.innerHTML = "";


          snapshot.forEach(
            docSnap => {

              renderMessageDoc(
                docSnap.data()
              );

            }
          );


          scrollToBottom();

        },

        (err) => {

          console.error(
            "messages listener error:",
            err
          );


          feed.innerHTML = "";


          const errorEl =
            document.createElement("div");


          errorEl.className =
            "sys-msg";


          errorEl.textContent =
            "[ CONNECTION ERROR — CHECK FIRESTORE RULES/CONFIG ]";


          feed.appendChild(
            errorEl
          );

        }
      );


      /* ---------- presence ---------- */

      onSnapshot(
        presenceCol,

        (snapshot) => {

          const now =
            Date.now();


          let active = 0;


          snapshot.forEach(
            docSnap => {

              const data =
                docSnap.data();


              if(
                data &&
                typeof data.lastSeen === "number" &&
                (
                  now -
                  data.lastSeen
                ) < PRESENCE_STALE_MS
              ){

                active++;

              }

            }
          );


          userCountEl.textContent =
            Math.max(
              1,
              active
            );

        },

        (err) => {

          console.error(
            "presence listener error:",
            err
          );

        }
      );


      /* ---------- purge ---------- */

      onSnapshot(
        purgeRef,

        (snap) => {

          if(
            snap.exists() &&
            typeof snap.data().purgeStart === "number"
          ){

            purgeStart =
              snap.data().purgeStart;

          }else{

            const start =
              Date.now();


            purgeStart =
              start;


            setDoc(
              purgeRef,
              {
                purgeStart:start
              },
              {
                merge:true
              }
            ).catch(
              e =>
                console.error(
                  "purge init error:",
                  e
                )
            );

          }


          tickPurge();

        },

        (err) => {

          console.error(
            "purge listener error:",
            err
          );

        }
      );


      setInterval(
        tickPurge,
        1000
      );


      tickPurge();


      /* ---------- heartbeat ---------- */

      heartbeat();


      setInterval(
        heartbeat,
        5000
      );


      pushSystemMessage(
        `[ ${myName} HAS JOINED THE NODE ]`
      );

    }


    /* =========================================================
       LOCK SCREEN
    ========================================================= */

    async function attemptUnlock(){

      if(
        passInput.value.trim() !== PASSWORD
      ){

        lockError.textContent =
          "ACCESS DENIED — INVALID CLEARANCE CODE";


        lockBox.classList.remove(
          "shake"
        );


        void lockBox.offsetWidth;


        lockBox.classList.add(
          "shake"
        );


        passInput.value = "";


        return;
      }


      unlockBtn.disabled = true;


      lockError.textContent =
        "AUTHENTICATING NODE...";


      lockError.style.color =
        "var(--lime-glow)";


      try{

        await signInAnonymously(
          auth
        );

      }catch(e){

        console.error(
          "auth error:",
          e
        );


        lockError.textContent =
          "CONNECTION FAILED — CHECK NETWORK / FIREBASE CONFIG";


        lockError.style.color =
          "var(--crimson)";


        unlockBtn.disabled = false;


        return;
      }


      lockScreen.classList.add(
        "lock-dissolve"
      );


      setTimeout(() => {

        lockScreen.style.display =
          "none";


        appEl.style.display =
          "flex";


        initChat();


        /*
          Focus only after app is visible.
        */

        setTimeout(() => {

          try{

            msgInput.focus({
              preventScroll:true
            });

          }catch{

            msgInput.focus();

          }

        }, 100);

      }, 680);

    }


    unlockBtn.addEventListener(
      "click",
      attemptUnlock
    );


    passInput.addEventListener(
      "keydown",
      (e) => {

        if(
          e.key === "Enter" &&
          !e.isComposing
        ){

          e.preventDefault();

          attemptUnlock();

        }

      }
    );


    passInput.addEventListener(
      "input",
      () => {

        lockError.textContent = "";

        lockError.style.color =
          "var(--crimson)";

      }
    );


    /* =========================================================
       MOBILE KEYBOARD / VISUAL VIEWPORT
    ========================================================= */

    if(window.visualViewport){

      window.visualViewport.addEventListener(
        "resize",
        () => {

          /*
            Let the browser handle the keyboard naturally.
            We only ensure the latest messages remain visible.
          */

          if(
            document.activeElement === msgInput
          ){

            requestAnimationFrame(
              scrollToBottom
            );

          }

        },
        { passive:true }
      );

    }


    /* =========================================================
       CLEANUP PRESENCE
    ========================================================= */

    window.addEventListener(
      "beforeunload",
      () => {

        if(chatInitialized){

          deleteDoc(
            doc(
              presenceCol,
              myId
            )
          ).catch(
            () => {}
          );

        }

      }
    );

  </script>

</body>
</html>
